spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dineflow}
    username: ${DB_USER:dineflow}
    password: ${DB_PASSWORD:dineflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8083}

# Shared JWT secret — must match the gateway's app.jwt.secret.
app:
  jwt:
    secret: ${JWT_SECRET:dev-local-secret-please-change-me-32chars-min}

# Standalone Socket.IO server (separate from the Tomcat port above). The frontend reaches it
# via a same-origin /rsocket.io proxy — a distinct path/context from order-service's /socket.io —
# so this port isn't published to the host.
socketio:
  host: ${SOCKETIO_HOST:0.0.0.0}
  port: ${SOCKETIO_PORT:9093}
  context: ${SOCKETIO_CONTEXT:/rsocket.io}

logging:
  level:
    org.hibernate.SQL: info
