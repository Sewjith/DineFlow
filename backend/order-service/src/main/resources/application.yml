spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dineflow}
    username: ${DB_USER:dineflow}
    password: ${DB_PASSWORD:dineflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8082}

# Base URL of menu-service, used to fetch live prices when placing an order.
menu-service:
  url: ${MENU_SERVICE_URL:http://localhost:8081}

# Shared JWT secret — must match the gateway's app.jwt.secret.
app:
  jwt:
    secret: ${JWT_SECRET:dev-local-secret-please-change-me-32chars-min}

# Standalone Socket.IO server (separate from the Tomcat port above). The frontend
# reaches it via a same-origin /socket.io proxy, so this port isn't published to the host.
socketio:
  host: ${SOCKETIO_HOST:0.0.0.0}
  port: ${SOCKETIO_PORT:9092}

logging:
  level:
    org.hibernate.SQL: info
