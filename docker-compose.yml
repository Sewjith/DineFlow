# DineFlow full local stack: postgres + 4 Spring Boot services + frontend.
# Start everything with:  docker compose up --build
# Values come from a local .env file (see .env.example); sensible defaults are inline.

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-dineflow}
  DB_USER: ${POSTGRES_USER:-dineflow}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-dineflow}
  JWT_SECRET: ${JWT_SECRET:-dev-local-secret-please-change-me-32chars-min}

services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineflow}
      POSTGRES_USER: ${POSTGRES_USER:-dineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineflow}
    ports:
      # Host 5433 avoids clashing with a native PostgreSQL on 5432. Internal port stays 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dineflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineflow} -d ${POSTGRES_DB:-dineflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  menu-service:
    build: ./backend/menu-service
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build: ./backend/order-service
    environment:
      <<: *db-env
      MENU_SERVICE_URL: http://menu-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8083
      # Socket.IO server for live admin updates; reached internally by the frontend nginx.
      SOCKETIO_HOST: 0.0.0.0
      SOCKETIO_PORT: 9092
    depends_on:
      postgres:
        condition: service_healthy
      reservation-service:
        condition: service_started
    restart: unless-stopped

  reservation-service:
    build: ./backend/reservation-service
    environment:
      <<: *db-env
      # Socket.IO server for live admin updates; reached internally by the frontend nginx.
      SOCKETIO_HOST: 0.0.0.0
      SOCKETIO_PORT: 9093
      SOCKETIO_CONTEXT: /rsocket.io
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./backend/api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-please-change-me-32chars-min}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2a$$10$$pxdmOOkSyHcnZlLhRRVjCusWX8OKEA.5UmvEUS8oPuwOVjnfROWaa}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      MENU_SERVICE_URI: http://menu-service:8081
      ORDER_SERVICE_URI: http://order-service:8082
      RESERVATION_SERVICE_URI: http://reservation-service:8083
    ports:
      - "8080:8080"
    depends_on:
      - menu-service
      - order-service
      - reservation-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  dineflow-pgdata:
